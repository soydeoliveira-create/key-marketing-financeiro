<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AIME Financy · Key Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: faixa da marca no topo, abas por assunto, um mês de referência que vale para todas as telas. */
:root{
  --bg:#F6F5F6; --surface:#FFFFFF; --surface-2:#F1ECEF; --line:#E5DDE2;
  --ink:#3A2430; --ink-2:#715D68; --ink-3:#9A8893;
  --pink:#E8628F; --pink-ink:#BE3F6B; --pink-soft:#FBE5ED;
  --teal:#1F6E78; --teal-ink:#1F6E78; --teal-soft:#DDEDEF;
  --warn:#9A5B00; --warn-soft:#FFF0D6;
  --bad:#B7322A; --bad-soft:#FBE2DF;
  --shadow:0 1px 2px rgba(58,36,48,.06),0 8px 24px -12px rgba(58,36,48,.18);
  --font:"Schibsted Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:10px;
  --hero-bg:#3A2430; --hero-fg:#F6F5F6; --hero-accent:#F58FB1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#181115; --surface:#221920; --surface-2:#2B2028; --line:#3B2D36;
  --ink:#F4EBF0; --ink-2:#C2AEB9; --ink-3:#8E7A86;
  --pink:#F07BA2; --pink-ink:#F58FB1; --pink-soft:#3B1E2B;
  --teal:#4DAEB9; --teal-ink:#6CC3CD; --teal-soft:#163339;
  --warn:#EBA94A; --warn-soft:#3A2A12;
  --bad:#F2766B; --bad-soft:#3F1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --hero-bg:#2F1F29; --hero-fg:#F4EBF0; --hero-accent:#F58FB1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#181115; --surface:#221920; --surface-2:#2B2028; --line:#3B2D36;
  --ink:#F4EBF0; --ink-2:#C2AEB9; --ink-3:#8E7A86;
  --pink:#F07BA2; --pink-ink:#F58FB1; --pink-soft:#3B1E2B;
  --teal:#4DAEB9; --teal-ink:#6CC3CD; --teal-soft:#163339;
  --warn:#EBA94A; --warn-soft:#3A2A12;
  --bad:#F2766B; --bad-soft:#3F1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
  --hero-bg:#2F1F29; --hero-fg:#F4EBF0; --hero-accent:#F58FB1;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
header.top{padding-block:22px 0}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand svg{height:44px;width:auto;flex:none;color:var(--ink)}
.brand b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1}
.spaced{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:var(--pink-ink);font-weight:500}
.brand .spaced{display:block;margin-top:6px}
.brand img{height:44px;width:auto;max-width:140px;object-fit:contain;flex:none}
.login .brand img{height:52px}
.brand .ini{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--hero-bg);color:var(--hero-fg);font-weight:800;font-size:18px;flex:none}
.brand .cnpj{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.brand b.nome{text-transform:none}
footer.sist{padding-block:0 28px;margin-top:-40px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.login .sist{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3);text-align:center;margin:0}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:transparent;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;color:var(--ink-2)}
.month button:hover{background:var(--surface-2);color:var(--ink)}
.month span{min-width:148px;text-align:center;font-weight:600;text-transform:capitalize}
.month .hoje{width:auto;padding:0 12px;border-radius:999px;font-size:13px}

nav.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pink)}
nav.tabs button:hover{color:var(--ink)}
nav.tabs .badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;margin-left:6px}

main{padding-block:24px 64px;display:grid;gap:24px}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:14px}

/* blocos */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.kpi .lbl{font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:13px;color:var(--ink-3);margin-top:2px}
.kpi.hl{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.kpi.hl .lbl,.kpi.hl .sub{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.pos{color:var(--teal-ink)} .neg{color:var(--bad)}
.kpi.hl .pos,.kpi.hl .neg{color:inherit}

.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.ph .hint{font-size:13px;color:var(--ink-3)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* tabelas */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
td.acts{text-align:right;white-space:nowrap}
td .muted{color:var(--ink-3);font-size:13px}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--teal-soft);color:var(--teal-ink)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.off{background:var(--surface-2);color:var(--ink-3)}
.tag{font-size:11px;font-weight:600;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.dir{font-weight:700}
.dir.in{color:var(--teal-ink)} .dir.out{color:var(--pink-ink)}

/* lista de vencimentos */
.due{display:grid;gap:0}
.dueitem{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dueitem:last-child{border-bottom:0}
.dday{text-align:center;border-radius:8px;padding:6px 0;background:var(--surface-2);line-height:1.05}
.dday b{display:block;font-size:20px}
.dday small{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.dday.late{background:var(--bad-soft);color:var(--bad)} .dday.late small{color:var(--bad)}
.dday.soon{background:var(--pink-soft);color:var(--pink-ink)} .dday.soon small{color:var(--pink-ink)}
.dueitem .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dueitem .s{font-size:13px;color:var(--ink-3)}
.dueitem .r{text-align:right;display:grid;gap:4px;justify-items:end}

/* gráfico */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .wd{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);padding:8px;font-weight:600;text-align:center}
.cal .day{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;border:0;text-align:left;min-width:0}
.cal .day:hover{background:var(--surface-2)}
.cal .day.out{background:var(--bg);color:var(--ink-3)}
.cal .day.wkend .n{color:var(--ink-3)}
.cal .day .n{font-size:13px;font-weight:600;display:flex;justify-content:space-between;gap:4px}
.cal .day .n em{font-style:normal;font-size:10px;color:var(--pink-ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .day.today .n span{background:var(--pink);color:#fff;border-radius:999px;padding:0 7px}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--pink)}
.chip{font-size:11.5px;line-height:1.25;padding:2px 6px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chip.tax{background:var(--pink-soft);color:var(--pink-ink)}
.chip.tax.late{background:var(--bad-soft);color:var(--bad)}
.chip.tax.ok{background:var(--teal-soft);color:var(--teal-ink);text-decoration:line-through;opacity:.8}
.chip.pay{background:var(--surface-2);color:var(--ink)}
.chip.rec{background:var(--teal-soft);color:var(--teal-ink)}
.chip.more{color:var(--ink-3);background:none;padding-left:2px}
.dots{display:none;gap:3px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--pink)}
.dots i.late{background:var(--bad)} .dots i.ok{background:var(--teal)} .dots i.pay{background:var(--ink-3)}

.bm input{width:100%;max-width:170px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;text-align:right}
.bm input:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}
.bm tr.zero td:first-child{color:var(--ink-3)}
.calc{display:grid;gap:0}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.calc div:last-child{border-bottom:0}
.calc .op{color:var(--ink-3);font-size:13px;display:block}
.calc .big{font-size:20px;font-weight:700}
/* resumo de fim de ano */
.resumo{background:var(--hero-bg);color:var(--hero-fg);border-radius:14px;padding:22px;display:grid;gap:16px;min-width:0}
.resumo .spaced{color:var(--hero-accent)}
.resumo h2{color:inherit;font-size:22px;margin-top:6px}
.resumo .rh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.resumo .rt{text-align:right}
.resumo .rt small,.resumo .rcol h3{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;opacity:.72;font-weight:600}
.resumo .rt b{font-size:34px;letter-spacing:-.02em;line-height:1.1}
.resumo .frase{margin:0;max-width:78ch;line-height:1.6;opacity:.94}
.resumo .frase b{color:var(--hero-accent)}
.resumo .rcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.resumo .rcol{background:rgba(255,255,255,.06);border-radius:10px;padding:14px 16px}
.resumo .rcol h3{margin:0 0 4px}
.resumo .rl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.resumo .rl small{display:block;font-size:12px;opacity:.65}
.resumo .rl.tot{border-bottom:0;padding-bottom:0}
.resumo .rl.tot b{font-size:20px;color:var(--hero-accent)}
.resumo .rfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;opacity:.85}
.resumo .btn.ghost{color:var(--hero-fg);border-color:rgba(255,255,255,.28)}
.resumo .btn.ghost:hover{background:rgba(255,255,255,.08);color:var(--hero-fg)}
.resumo .rcol.full{grid-column:1/-1}
.resumo .rp{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.12)}
.resumo .rp time{font-size:13px;font-weight:700}
.resumo .rp span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resumo .rp small{opacity:.65;font-size:12px;margin-left:6px}
@media (max-width:620px){.resumo .rcols{grid-template-columns:minmax(0,1fr)}.resumo .rt{text-align:left}.resumo .rt b{font-size:28px}}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note{font-size:13px;color:var(--ink-2);max-width:68ch}
.note b{color:var(--ink)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(30,15,24,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal header{padding:18px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal form{padding:16px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:grid;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.f input,.f select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-width:0}
.f input:focus,.f select:focus{outline:2px solid var(--pink);outline-offset:-1px;border-color:transparent}
.f.check{grid-template-columns:auto 1fr;align-items:center}
.f.check input{width:18px;height:18px}
.f .help{font-size:12px;color:var(--ink-3)}
.mactions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.err{grid-column:1/-1;color:var(--bad);font-size:13px}

/* login */
.login{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.login .box{width:min(400px,100%);display:grid;gap:22px}
.login .brand svg{height:52px}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.login h1{font-size:20px;margin:0;letter-spacing:-.01em}
.login p{margin:0;color:var(--ink-2);font-size:14px}
.login .msg{font-size:13.5px;padding:10px 12px;border-radius:8px}
.login .msg.erro{background:var(--bad-soft);color:var(--bad)}
.login .msg.ok{background:var(--teal-soft);color:var(--teal-ink)}
.login .troca{background:none;border:0;color:var(--pink-ink);font-weight:600;cursor:pointer;padding:0;font-size:14px;justify-self:start}
.sair{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink-2)}
.sair:hover{color:var(--ink);border-color:var(--ink-3)}
.toprt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:60;box-shadow:var(--shadow)}

@media (max-width:900px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .cards3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:620px){
  .cal .day{min-height:58px}
  .cal .chip{display:none}
  .cal .dots{display:flex}
  .cal .day .n em{display:none}
  .modal form{grid-template-columns:1fr}
  .kpi .val{font-size:21px}
  .month span{min-width:118px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brandrow">
      <div class="brand" id="marca"></div>
      <div class="toprt">
      <div class="month" role="group" aria-label="Mês de referência">
        <button id="mPrev" aria-label="Mês anterior">‹</button>
        <span id="mLabel">—</span>
        <button id="mNext" aria-label="Próximo mês">›</button>
        <button id="mHoje" class="hoje">Hoje</button>
      </div>
      <button id="btnMarca" class="sair" data-act="marca" hidden>Empresa</button>
      <button id="btnSair" class="sair" hidden>Sair</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-v="geral">Visão geral</button>
      <button role="tab" data-v="lanc">Entradas e saídas</button>
      <button role="tab" data-v="notas">Notas fiscais</button>
      <button role="tab" data-v="impostos">Impostos e obrigações</button>
      <button role="tab" data-v="cal">Calendário</button>
      <button role="tab" data-v="beneficios">13º e férias PJ</button>
      <button role="tab" data-v="clt">Funcionários</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><div class="empty"><b>Carregando o AIME Financy…</b>Buscando lançamentos, notas e obrigações.</div></main>

<footer class="wrap sist">AIME Financy · um produto AIME Tech</footer>

<div class="login" id="login" hidden>
  <div class="box">
    <div class="brand" id="marcaLogin"></div>
    <form id="loginForm" novalidate>
      <h1 id="loginTitulo">Entrar no AIME Financy</h1>
      <p id="loginSub">Use o e-mail e a senha da sua conta.</p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const brl=v=>BRL.format(+v||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fromD=d=>iso(d.getFullYear(),d.getMonth()+1,d.getDate());
const hoje=()=>fromD(new Date());
const ym=(y,m)=>`${y}-${pad(m)}`;
const addM=(y,m,n)=>{const d=new Date(y,m-1+n,1);return{y:d.getFullYear(),m:d.getMonth()+1}};
const daysIn=(y,m)=>new Date(y,m,0).getDate();
const fmtD=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`};
const fmtYM=s=>{if(!s)return'—';const[y,m]=s.split('-');return`${MES3[+m-1]}/${y}`};
const diff=(a,b)=>Math.round((toD(a)-toD(b))/864e5);

/* feriados nacionais e dias sem expediente bancário */
const ferCache={};
function feriados(y){
  if(ferCache[y])return ferCache[y];
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  const pascoa=new Date(y,mo-1,da);
  const rel=(n)=>{const x=new Date(pascoa);x.setDate(x.getDate()+n);return fromD(x)};
  const map={};
  [['01-01','Confraternização'],['04-21','Tiradentes'],['05-01','Dia do Trabalho'],['09-07','Independência'],['10-12','N. Sra. Aparecida'],['11-02','Finados'],['11-15','Proclamação da República'],['11-20','Consciência Negra'],['12-25','Natal']].forEach(([md,n])=>map[`${y}-${md}`]=n);
  map[rel(-48)]='Carnaval';map[rel(-47)]='Carnaval';map[rel(-2)]='Sexta-feira Santa';map[rel(60)]='Corpus Christi';
  return ferCache[y]=map;
}
const feriado=s=>feriados(+s.slice(0,4))[s];
const util=s=>{const w=toD(s).getDay();return w!==0&&w!==6&&!feriado(s)};
function ajustar(s,modo){let d=toD(s);let k=0;while(!util(fromD(d))&&k<10){d.setDate(d.getDate()+(modo==='anterior'?-1:1));k++}return fromD(d)}

const CAT_IN=['Serviços prestados','Gestão de redes sociais','Tráfego pago (gestão)','Consultoria','Rendimentos','Aporte dos sócios','Outras entradas'];
const CAT_OUT=['Impostos e taxas','Pró-labore','Mídia paga (anúncios)','Ferramentas e softwares','Freelancers e fornecedores','Contabilidade','Aluguel e coworking','Internet e telefone','Tarifas bancárias','Equipamentos','Outras saídas'];

const now=new Date();
const S={lanc:[],notas:[],obrig:[],modelos:[],benef:{},clt:{},desc:[],func:[],funcSel:null,config:{aliquota:6},ref:{y:now.getFullYear(),m:now.getMonth()+1},view:'geral',dia:null,lancTipo:'todos',db:null,canWrite:true,loaded:0,offline:false};
try{const v=localStorage.getItem('km-view');if(v)S.view=v}catch(e){}
const h=location.hash.replace('#','');if(['geral','lanc','notas','impostos','cal','beneficios','clt'].includes(h))S.view=h;

const app=document.getElementById('app');
const refYM=()=>ym(S.ref.y,S.ref.m);
const inMonth=(s,k=refYM())=>!!s&&s.slice(0,7)===k;

/* estados */
function obStatus(o){if(o.status==='pago')return'pago';const t=hoje();if(o.vencimento<t)return'vencido';return'pendente'}
function obPill(o){const s=obStatus(o);if(s==='pago')return`<span class="pill ok">Pago${o.pagoEm?' '+fmtD(o.pagoEm).slice(0,5):''}</span>`;if(s==='vencido')return`<span class="pill late">Vencido há ${diff(hoje(),o.vencimento)}d</span>`;const dd=diff(o.vencimento,hoje());return`<span class="pill wait">${dd===0?'Vence hoje':dd===1?'Vence amanhã':'Em '+dd+' dias'}</span>`}
function nfStatus(n){if(n.status==='cancelada')return'cancelada';if(n.status==='recebida')return'recebida';if(n.vencimento&&n.vencimento<hoje())return'atrasada';return'areceber'}
function nfPill(n){const s=nfStatus(n);return{cancelada:'<span class="pill off">Cancelada</span>',recebida:'<span class="pill ok">Recebida</span>',atrasada:'<span class="pill late">Recebimento atrasado</span>',areceber:'<span class="pill wait">A receber</span>'}[s]}

/* números */
function totais(k){
  let ent=0,sai=0,entP=0,saiP=0;
  for(const l of S.lanc){if(!inMonth(l.data,k))continue;const v=+l.valor||0;
    if(l.tipo==='entrada'){l.status==='pendente'?entP+=v:ent+=v}else{l.status==='pendente'?saiP+=v:sai+=v}}
  return{ent,sai,entP,saiP,res:ent-sai};
}
function faturado(k){return S.notas.filter(n=>n.status!=='cancelada'&&inMonth(n.dataEmissao,k)).reduce((a,n)=>a+(+n.valor||0),0)}
function rbt12(){let t=0;for(let i=1;i<=12;i++){const p=addM(S.ref.y,S.ref.m,-i);t+=faturado(ym(p.y,p.m))}return t}

/* ---------- marca de cada conta ---------- */
const KEY_SVG='<svg viewBox="0 0 340 330" aria-hidden="true"><rect x="0" y="0" width="56" height="320" fill="currentColor"/><path d="M56 132 L228 22 L262 72 L120 166 Z" fill="currentColor"/><path d="M56 186 L120 166 L250 252 L232 302 Z" fill="currentColor"/><circle cx="288" cy="48" r="48" fill="#E8628F"/><rect x="240" y="224" width="96" height="96" rx="10" fill="#1F6E78"/></svg>';
const COR=/^#[0-9a-f]{6}$/i;
// fora do login vale a última marca usada neste navegador
function marcaAtual(){
  if(S.db)return{nome:S.config.empresaNome||'',cnpj:S.config.cnpj||'',logo:S.config.logo||'',c1:S.config.corPrincipal||'',c2:S.config.corDestaque||''};
  try{return JSON.parse(localStorage.getItem('km-marca')||'null')||{logo:'key'}}catch(e){return{logo:'key'}}
}
function aplicarMarca(){
  const m=marcaAtual(),key=m.logo==='key';
  const iniciais=(m.nome||'F').split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
  // o nome da empresa é o que cada conta cadastrar; AIME Financy é o nome do sistema
  const nome=m.nome||(key?'key marketing':'');
  const html=`${key?KEY_SVG:m.logo?`<img src="${esc(m.logo)}" alt="">`:`<span class="ini" aria-hidden="true">${esc(iniciais)}</span>`}<div><b class="nome">${esc(nome||'Sua empresa')}</b><span class="spaced">Financeiro</span>${m.cnpj&&!key?`<span class="cnpj">CNPJ ${esc(m.cnpj)}</span>`:''}</div>`;
  for(const id of['marca','marcaLogin']){const el=document.getElementById(id);if(el&&el.dataset.h!==html){el.innerHTML=html;el.dataset.h=html}}
  document.title=nome?`${nome} · AIME Financy`:'AIME Financy';
  const st=document.documentElement.style;
  if(!key&&COR.test(m.c2||'')){st.setProperty('--pink',m.c2);st.setProperty('--pink-ink',`color-mix(in srgb,${m.c2} 78%,var(--ink))`);st.setProperty('--pink-soft',`color-mix(in srgb,${m.c2} 16%,var(--surface))`);st.setProperty('--hero-accent',`color-mix(in srgb,${m.c2} 70%,#fff)`)}
  else ['--pink','--pink-ink','--pink-soft','--hero-accent'].forEach(p=>st.removeProperty(p));
  if(!key&&COR.test(m.c1||''))st.setProperty('--hero-bg',m.c1);else st.removeProperty('--hero-bg');
  const b=document.getElementById('btnMarca');if(b)b.hidden=!S.db;
  if(S.db&&S.carregou){try{const c={...m};if((c.logo||'').length>200000)c.logo='';localStorage.setItem('km-marca',JSON.stringify(c))}catch(e){}}
}

/* ---------- telas ---------- */
function render(){
  aplicarMarca();
  document.getElementById('mLabel').textContent=`${MESES[S.ref.m-1]} ${S.ref.y}`;
  const atras=S.obrig.filter(o=>obStatus(o)==='vencido').length;
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.setAttribute('aria-selected',b.dataset.v===S.view);
    if(b.dataset.v==='impostos')b.innerHTML='Impostos e obrigações'+(atras?`<span class="badge" title="Obrigações vencidas">${atras}</span>`:'');
  });
  let html='';
  if(S.offline)html+=`<div class="banner">Não foi possível carregar os dados do Supabase. Confira a internet e recarregue a página.</div>`;
  if(!S.db&&S.loaded<0)html+=`<div class="banner">Não foi possível carregar a conexão com o banco de dados. Confira a internet e recarregue a página.</div>`;
  if(S.semAcesso)html+=`<div class="banner">A conta ${esc(S.email||'')} entrou, mas ainda não tem acesso aos dados da empresa. Peça para liberar este e-mail no Supabase.</div>`;
  if(!S.canWrite&&!S.semAcesso)html+=`<div class="banner">Você está vendo o painel em modo leitura.</div>`;
  if(S.db&&S.carregou&&!S.config.empresaNome&&S.canWrite)html+=`<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>Cadastre o nome, o CNPJ, o logo e as cores da sua empresa. Eles aparecem no topo do painel.</span><button class="btn primary sm" data-act="marca">Cadastrar empresa</button></div>`;
  html+=({geral:vGeral,lanc:vLanc,notas:vNotas,impostos:vImpostos,cal:vCal,beneficios:vBeneficios,clt:vClt}[S.view]||vGeral)();
  // mantém o campo em que a pessoa está digitando quando chegam dados novos
  const ae=document.activeElement,fid=ae&&app.contains(ae)&&ae.id,fval=fid&&ae.value;
  app.innerHTML=html;
  if(fid){const el=document.getElementById(fid);if(el){if(fval!==undefined&&el.value!==fval)el.value=fval;el.focus()}}
}

/* 13º e férias: média do que a PJ recebeu no ano */
function benefMeses(y){return(S.benef[String(y)]||{}).meses||{}}
/* ---------- CLT (pessoa física): separada da PJ ---------- */
// Tabelas de 2026. INSS: Portaria Interministerial MPS/MF 13/2026. IR: Receita Federal + redução da Lei 15.270/2025.
const INSS_FAIXAS=[[1621.00,0.075],[2902.84,0.09],[4354.27,0.12],[8475.55,0.14]];
const IR_FAIXAS=[[2428.80,0,0],[2826.65,0.075,182.16],[3751.05,0.15,394.16],[4664.68,0.225,675.49],[Infinity,0.275,908.73]];
const IR_DEPENDENTE=189.59,IR_SIMPLIFICADO=607.20;
const r2=v=>Math.round((v+Number.EPSILON)*100)/100;
function inss(v){let t=0,ant=0;for(const[lim,al]of INSS_FAIXAS){if(v<=ant)break;t+=(Math.min(v,lim)-ant)*al;ant=lim}return r2(t)}
// simplificado: a fonte pagadora usa o maior entre (INSS + dependentes) e o desconto simplificado; no 13º só valem INSS e dependentes
function irrf(bruto,inssV,deps,simplificado){
  const legais=inssV+deps*IR_DEPENDENTE,ded=simplificado?Math.max(legais,IR_SIMPLIFICADO):legais;
  const base=Math.max(0,bruto-ded),f=IR_FAIXAS.find(([lim])=>base<=lim);
  const imp=Math.max(0,base*f[1]-f[2]);
  const red=bruto<=5000?Math.min(312.89,imp):bruto<=7350?Math.max(0,978.62-0.133145*bruto):0;
  return r2(Math.max(0,imp-red));
}
function liquido(bruto,deps,simplificado){const i=inss(bruto),ir=irrf(bruto,i,deps,simplificado);return{bruto:r2(bruto),inss:i,ir,liq:r2(bruto-i-ir)}}
/* funcionários: cada um com os próprios salários, descontos, 13º e férias */
const salDe=f=>(f&&S.clt[f.id])||{};
const funcAtual=()=>S.func.find(f=>f.id===S.funcSel)||S.func.find(f=>f.ativo!==false)||S.func[0]||null;
const ordemFunc=()=>[...S.func].sort((a,b)=>(a.ativo===false)-(b.ativo===false)||String(a.nome).localeCompare(String(b.nome),'pt'));
const ehPj=f=>f&&f.regime==='pj';
const REGIME={clt:'CLT',pj:'PJ'};
// PJ não tem INSS nem IR descontados na folha
function liquidoF(bruto,f,simpl){if(ehPj(f))return{bruto:r2(bruto),inss:0,ir:0,liq:r2(bruto)};return liquido(bruto,+f.dependentes||0,simpl)}
// 13º = soma dos salários do ano ÷ meses com salário; férias = 13º + 1/3
function cltCalc(y,f){
  if(!f||!f.admissao)return null;
  const adm=f.admissao,admY=+adm.slice(0,4),admM=+adm.slice(5,7);
  const ini=y<admY?13:y===admY?admM:1,sal=salDe(f);
  const vals=MESES.map((_,i)=>i+1>=ini?(sal[ym(y,i+1)]||0):0);
  const n=vals.filter(v=>v>0).length,soma=vals.reduce((a,b)=>a+b,0);
  const dec=n?soma/n:0,terco=dec/3,fer=dec+terco;
  const deps=+f.dependentes||0;
  // outros descontos (plano de saúde, empréstimo…) saem do líquido
  // o 13º é pago em dezembro: vale o desconto ativo em dezembro; nas férias, o que estiver ativo no mês escolhido no topo
  const o13=descontosDe('13',ym(y,12),f),oFer=descontosDe('ferias',refYM(),f);
  const b13=liquidoF(dec,f,false),bFer=liquidoF(fer,f,true);
  const l13={...b13,outros:o13,liq:r2(b13.liq-o13)},lFer={...bFer,outros:oFer,liq:r2(bFer.liq-oFer)};
  return{f,adm,ini,vals,n,soma,dec,terco,fer,total:dec+fer,deps,l13,lFer,parc1:r2(dec/2),parc2:r2(l13.liq-dec/2)};
}
// visão de todos os funcionários: salário do mês, 13º e férias de cada um
function vFolha(y){
  const k=refYM(),dis=S.canWrite?'':'disabled',sel=funcAtual();
  const linhas=ordemFunc().map(f=>{const c=cltCalc(y,f),v=salDe(f)[k]||0,s=v?salarioLiquido(k,f):null;return{f,c,v,s}});
  const ativos=linhas.filter(l=>l.f.ativo!==false);
  const soma=fn=>r2(ativos.reduce((a,l)=>a+(fn(l)||0),0));
  const folha=soma(l=>l.v),folhaLiq=soma(l=>l.s&&l.s.liq),dec=soma(l=>l.c&&l.c.dec),fer=soma(l=>l.c&&l.c.fer);
  return `
  <section class="kpis">
    <div class="kpi"><div class="lbl">Funcionários</div><div class="val">${ativos.length}</div><div class="sub">${linhas.length-ativos.length?`+ ${linhas.length-ativos.length} desligado(s)`:'ativos'}</div></div>
    <div class="kpi"><div class="lbl">Folha de ${MESES[S.ref.m-1]}</div><div class="val">${brl(folha)}</div><div class="sub">bruto · líquido ${brl(folhaLiq)}</div></div>
    <div class="kpi hl"><div class="lbl">13º de ${y}</div><div class="val">${brl(dec)}</div><div class="sub">bruto, todos os funcionários</div></div>
    <div class="kpi"><div class="lbl">Férias + 1/3</div><div class="val pos">${brl(fer)}</div><div class="sub">bruto, todos os funcionários</div></div>
  </section>
  <div class="panel">
    <div class="ph"><h2>Funcionários${S.config.empresaNome?` · ${esc(S.config.empresaNome)}`:''}</h2><div class="toolbar"><span class="hint">salário de ${MESES[S.ref.m-1]}</span><button class="btn primary sm" data-act="novoFunc" ${dis}>+ Funcionário</button></div></div>
    <div class="tw"><table><thead><tr><th>Funcionário</th><th>Regime</th><th class="num">Salário bruto</th><th class="num">Líquido</th><th class="num">13º</th><th class="num">Férias + 1/3</th><th></th></tr></thead><tbody>
    ${linhas.map(({f,c,v,s})=>`<tr style="${f.ativo===false?'opacity:.55':''}${sel&&sel.id===f.id?';background:var(--pink-soft)':''}"><td><b>${esc(f.nome)}</b>${f.eu?'<span class="tag">você</span>':''}${f.ativo===false?'<span class="tag">desligado</span>':''}<div class="muted">${esc([f.cargo,f.cpf&&'CPF '+f.cpf].filter(Boolean).join(' · ')||'—')}</div></td>
      <td>${REGIME[f.regime]||'CLT'}</td><td class="num">${v?brl(v):'<span class="muted">não lançado</span>'}</td><td class="num">${s?`<b>${brl(s.liq)}</b>`:'<span class="muted">—</span>'}</td>
      <td class="num">${c&&c.n?brl(c.dec):'<span class="muted">—</span>'}</td><td class="num">${c&&c.n?brl(c.fer):'<span class="muted">—</span>'}</td>
      <td class="acts"><button class="btn ${sel&&sel.id===f.id?'teal':''} sm" data-act="verFunc" data-id="${f.id}" aria-pressed="${!!(sel&&sel.id===f.id)}">${sel&&sel.id===f.id?'Aberto':'Abrir'}</button></td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="2">Total dos ativos</td><td class="num">${brl(folha)}</td><td class="num">${brl(folhaLiq)}</td><td class="num">${brl(dec)}</td><td class="num">${brl(fer)}</td><td></td></tr></tfoot></table></div>
    <p class="note" style="margin:12px 0 0">Clique em <b>Abrir</b> para lançar os salários e os descontos de cada funcionário. Os valores de 13º e férias são brutos; o líquido de cada um aparece ao abrir.</p>
  </div>`;
}
function vClt(){
  const dis=S.canWrite?'':'disabled';
  if(!S.func.length)return `<div class="panel"><div class="empty"><b>Nenhum funcionário cadastrado</b>Cadastre cada funcionário da empresa com nome, regime e data de admissão. Depois, lance o salário de cada mês: o painel calcula o líquido, o 13º e as férias de cada um.<div style="margin-top:14px"><button class="btn primary" data-act="novoFunc" ${dis}>+ Funcionário</button></div></div></div>`;
  const y=S.ref.y,f=funcAtual(),c=cltCalc(y,f);
  const cab=`<div class="banner" style="background:var(--teal-soft);color:var(--teal-ink);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span><b>${esc(f.nome)}</b>${f.cargo?` · ${esc(f.cargo)}`:''} · ${ehPj(f)?'PJ, sem INSS e IR':'CLT'}${f.admissao?` · admissão em ${fmtD(f.admissao)}`:''}. Nada da folha entra nas entradas, saídas ou no 13º da PJ.</span><span class="toolbar">${c?`<button class="btn teal sm" data-act="pdfFunc" data-id="${f.id}">PDF do 13º e férias</button>`:''}<button class="btn ghost sm" data-act="editFunc" data-id="${f.id}" ${dis}>Editar funcionário</button>${S.canWrite?`<button class="btn ghost sm danger" data-act="delFunc" data-id="${f.id}">Excluir</button>`:''}</span></div>`;
  if(!c)return vFolha(y)+cab+`<div class="panel"><div class="empty"><b>Falta a data de admissão de ${esc(f.nome)}</b>Os meses antes da admissão não entram no 13º e nas férias.<div style="margin-top:14px"><button class="btn primary" data-act="editFunc" data-id="${f.id}" ${dis}>Informar data de admissão</button></div></div></div>`;
  const possiveis=Math.max(0,13-c.ini),sal=salDe(f);
  const rows=MESES.map((m,i)=>{const k=ym(y,i+1),v=c.vals[i];
    if(i+1<c.ini)return `<tr class="zero"><td style="text-transform:capitalize">${m}</td><td class="num"><span class="muted">antes da admissão</span></td><td></td></tr>`;
    const lq=v?salarioLiquido(k,f):null;
    return `<tr class="${v?'':'zero'}"><td style="text-transform:capitalize">${m}</td><td class="num"><input id="clt-${esc(f.id)}-${k}" data-clt="${k}" data-f="${esc(f.id)}" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0,00" value="${v||''}" aria-label="Salário bruto de ${m} de ${esc(f.nome)}" ${dis}></td>

  const liqAno=MESES.reduce((a,_,i)=>{const k=ym(y,i+1);return a+(i+1>=c.ini&&sal[k]>0?salarioLiquido(k,f).liq:0)},0);

/* impostos que ficam na conta: o DAS de cada competência sai do que a PJ recebe */
const aliq=()=>(+S.config.aliquota||0)/100;
const aliqTxt=()=>String(S.config.aliquota||0).replace('.',',')+'%';
const dasDe=v=>r2((+v||0)*aliq());
const semDas=v=>r2((+v||0)-dasDe(v));
const dasDaComp=k=>S.obrig.find(o=>o.competencia===k&&(o.modeloId==='das'||/^das\b/i.test(o.nome||'')));
function impostosNaConta(){
  const comps=[...new Set(S.notas.filter(n=>n.status!=='cancelada'&&n.dataEmissao).map(n=>n.dataEmissao.slice(0,7)))].sort();
  const linhas=comps.map(k=>{
    const fat=faturado(k),o=dasDaComp(k),[y,m]=k.split('-').map(Number),p=addM(y,m,1);
    const recebido=S.notas.filter(n=>n.status==='recebida'&&inMonth(n.dataEmissao,k)).reduce((a,n)=>a+(+n.valor||0),0);
    const venc=o?o.vencimento:ajustar(iso(p.y,p.m,20),'proximo');
    const valor=o&&+o.valor?+o.valor:dasDe(fat);
    // sem obrigação lançada e já vencido: foi pago fora do painel
    const sit=o?(o.status==='pago'?'pago':'conta'):(venc<hoje()?'fora':'conta');
    return{k,fat,recebido,valor:r2(valor),venc,sit,est:!o||!!o.calculado,o};
  });
  const naConta=linhas.filter(l=>l.sit==='conta');
  const total=r2(naConta.reduce((a,l)=>a+l.valor,0)),recebido=r2(naConta.reduce((a,l)=>a+l.recebido,0));
  return{linhas,naConta,total,recebido,livre:r2(recebido-total)};
}
function vImpostosConta(){

  </div>`;
}

/* resumo do fim de ano: 13º e férias da PJ (sem o DAS) + CLT (líquido) */
function resumoAno(y){
  // na CLT, entra no "Seu fim de ano" só o funcionário marcado como "sou eu"
  const eu=S.func.find(f=>f.eu&&f.ativo!==false);
  const pj=calcBenef(y),clt=cltCalc(y,eu),temPj=pj.n>0,temClt=!!clt&&clt.n>0;
  const decPj=temPj?semDas(pj.dec):0,ferPj=temPj?semDas(pj.fer):0,decClt=temClt?clt.l13.liq:0,ferClt=temClt?clt.lFer.liq:0;
  return{pj,clt,temPj,temClt,decPj,ferPj,decClt,ferClt,dec:decPj+decClt,fer:ferPj+ferClt,tot:decPj+decClt+ferPj+ferClt};
}
// o que ainda falta pagar até 31/12: impostos e contas em aberto + os dos meses que ainda não foram gerados
function previsaoPagamentos(y){
  const fim=iso(y,12,31),itens=[];
  S.obrig.filter(o=>o.status!=='pago'&&o.vencimento<=fim).forEach(o=>itens.push({d:o.vencimento,n:o.nome,v:+o.valor||0,k:'obrigação',est:!!o.calculado}));
  S.lanc.filter(l=>l.tipo==='saida'&&l.status==='pendente'&&l.data<=fim).forEach(l=>itens.push({d:l.data,n:l.descricao,v:+l.valor||0,k:l.origem==='fixa'?'conta fixa':'conta'}));
  const agora=new Date(),ay=agora.getFullYear();
  for(let m=y===ay?agora.getMonth()+1:y>ay?1:13;m<=12;m++){
    modelosDoMes(y,m).filter(x=>!S.obrig.some(o=>o.id===x.id)).forEach(x=>itens.push({d:x.vencimento,n:x.nome,v:+x.valor||0,k:'obrigação',est:true}));
    fixasDoMes(y,m).filter(x=>!S.lanc.some(l=>l.id===x.id)).forEach(x=>itens.push({d:x.data,n:x.descricao,v:+x.valor||0,k:'conta fixa'}));
  }
  itens.sort((a,b)=>a.d.localeCompare(b.d));
  return{itens,total:itens.reduce((a,i)=>a+i.v,0),semValor:itens.filter(i=>!i.v).length};
}

function chart(){
  const ms=[];for(let i=5;i>=0;i--){const p=addM(S.ref.y,S.ref.m,-i);const t=totais(ym(p.y,p.m));ms.push({...p,e:t.ent,s:t.sai})}
  const bruto=Math.max(0,...ms.flatMap(x=>[x.e,x.s])),vazio=bruto<=0,max=vazio?1000:bruto;
  const step=niceStep(max/4),top=Math.ceil(max/step)*step;
  const W=560,H=240,L=64,B=28,T=10,cw=(W-L-8)/6,bw=Math.min(28,cw*.3);
  const y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${short(v)}</text>`}
  ms.forEach((x,i)=>{const cx=L+cw*i+cw/2;const cur=x.y===S.ref.y&&x.m===S.ref.m;
    g+=`<rect x="${cx-bw-2}" y="${y(x.e)}" width="${bw}" height="${Math.max(0,y(0)-y(x.e))}" rx="3" fill="var(--teal)"><title>Entradas ${MES3[x.m-1]}: ${brl(x.e)}</title></rect>`;
    g+=`<rect x="${cx+2}" y="${y(x.s)}" width="${bw}" height="${Math.max(0,y(0)-y(x.s))}" rx="3" fill="var(--pink)"><title>Saídas ${MES3[x.m-1]}: ${brl(x.s)}</title></rect>`;
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="${cur?700:400}" fill="${cur?'var(--ink)':'var(--ink-2)'}">${MES3[x.m-1]}</text>`});
  if(vazio)g+=`<rect x="${L+(W-L)/2-150}" y="${y(top/2)-20}" width="300" height="34" rx="6" fill="var(--surface)"/><text x="${L+(W-L)/2}" y="${y(top/2)+2}" text-anchor="middle" font-size="13" fill="var(--ink-2)">Sem entradas ou saídas pagas nestes meses</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas e saídas dos últimos seis meses">${g}</svg>`;
}
function niceStep(r){if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r)));const f=r/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function short(v){if(v>=1e6)return(v/1e6).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mi';if(v>=1e3)return(v/1e3).toLocaleString('pt-BR',{maximumFractionDigits:1})+' mil';return v.toLocaleString('pt-BR')}

function itensDoDia(s){
  const it=[];
  S.obrig.filter(o=>o.vencimento===s).forEach(o=>it.push({c:'tax '+(obStatus(o)==='pago'?'ok':obStatus(o)==='vencido'?'late':''),dot:obStatus(o)==='pago'?'ok':obStatus(o)==='vencido'?'late':'',t:o.nome,v:o.valor,k:'Imposto',o,act:o.status!=='pago'?'pagarOb':null}));
  S.lanc.filter(l=>l.status==='pendente'&&l.data===s).forEach(l=>it.push({c:l.tipo==='entrada'?'rec':'pay',dot:'pay',t:l.descricao,v:l.valor,k:l.tipo==='entrada'?'A receber':'Conta a pagar',o:l,act:'pagarLanc'}));
  S.notas.filter(n=>n.vencimento===s&&['areceber','atrasada'].includes(nfStatus(n))).forEach(n=>it.push({c:'rec',dot:'ok',t:`NF ${n.numero} · ${n.cliente}`,v:(+n.valor||0)-(+n.issRetido||0),k:'Recebimento previsto',o:n,act:'receberNota'}));
  return it;
}
function vCal(){
  const {y,m}=S.ref;const first=new Date(y,m-1,1).getDay();const dim=daysIn(y,m);const t=hoje();
  let cells=SEM.map(d=>`<div class="wd">${d}</div>`).join('');
  const start=new Date(y,m-1,1-first);
  const total=Math.ceil((first+dim)/7)*7;
  for(let i=0;i<total;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=fromD(d);const out=d.getMonth()!==m-1;
    const it=itensDoDia(s);const fer=feriado(s);const w=d.getDay();
    cells+=`<button class="day ${out?'out':''} ${w===0||w===6?'wkend':''} ${s===t?'today':''} ${S.dia===s?'sel':''}" data-dia="${s}" aria-label="${fmtD(s)}${it.length?', '+it.length+' item(ns)':''}">
      <div class="n"><span>${d.getDate()}</span>${fer?`<em title="${fer}">${fer}</em>`:''}</div>
      ${it.slice(0,3).map(x=>`<div class="chip ${x.c}" title="${esc(x.t)} · ${brl(x.v)}">${esc(x.t)}</div>`).join('')}${it.length>3?`<div class="chip more">+${it.length-3}</div>`:''}
      <div class="dots">${it.map(x=>`<i class="${x.dot}"></i>`).join('')}</div></button>`}
  const sel=S.dia&&inMonth(S.dia)?S.dia:null;
  const mesItens=[];for(let d=1;d<=dim;d++){const s=iso(y,m,d);itensDoDia(s).forEach(x=>mesItens.push({...x,s}))}
  const lista=sel?itensDoDia(sel).map(x=>({...x,s:sel})):mesItens;
  return `
  <div class="panel">
    <div class="ph"><h2>Calendário de ${MESES[m-1]}</h2><div class="legend"><span><i style="background:var(--pink)"></i>Imposto a pagar</span><span><i style="background:var(--bad)"></i>Vencido</span><span><i style="background:var(--teal)"></i>Pago ou a receber</span><span><i style="background:var(--ink-3)"></i>Conta a pagar</span></div></div>
    <div class="cal">${cells}</div>
  </div>
  <div class="panel">
    <div class="ph"><h2>${sel?`${SEM[toD(sel).getDay()]}, ${fmtD(sel)}`:`Tudo que vence em ${MESES[m-1]}`}</h2>${sel?'<button class="btn ghost sm" data-dia="">Ver o mês inteiro</button>':`<span class="hint">toque num dia para filtrar</span>`}</div>
    ${lista.length?`<div class="due">${lista.map(x=>{const d=toD(x.s);const late=x.s<t&&!/ok/.test(x.c)&&x.act;return`<div class="dueitem"><div class="dday ${late?'late':''}"><b>${pad(d.getDate())}</b><small>${SEM[d.getDay()]}</small></div><div style="min-width:0"><div class="t">${esc(x.t)}</div><div class="s">${x.k}${x.o.competencia?' · comp. '+fmtYM(x.o.competencia):''}</div></div><div class="r"><b>${+x.v?brl(x.v):'<span class="muted">a definir</span>'}</b>${x.act&&S.canWrite?`<button class="btn sm teal" data-act="${x.act}" data-id="${x.o.id}">${x.act==='receberNota'?'Recebi':'Marcar pago'}</button>`:/ok/.test(x.c)?'<span class="pill ok">Pago</span>':''}</div></div>`}).join('')}</div>`
    :`<div class="empty"><b>Nada vence ${sel?'neste dia':'neste mês'}</b>Impostos, contas em aberto e recebimentos previstos aparecem aqui.</div>`}
  </div>`;
}

/* ---------- recorrentes ---------- */
function modelosDoMes(y,m){
  const out=[];
  for(const md of S.modelos){if(md.ativo===false||md.tipo==='despesa')continue;
    if(md.periodicidade==='anual'&&+md.mes!==m)continue;
    const dia=Math.min(+md.dia||20,daysIn(y,m));const orig=iso(y,m,dia);const venc=ajustar(orig,md.ajuste);
    const comp=md.periodicidade==='anual'?String(y-1):(()=>{const p=addM(y,m,-1);return ym(p.y,p.m)})();
    let valor=+md.valorPadrao||0,calculado=false;
    if(md.calculo==='das'){valor=Math.round(faturado(comp)*(+S.config.aliquota||0))/100;calculado=true}
    out.push({id:`${md.id}-${ym(y,m)}`,nome:md.nome,competencia:md.periodicidade==='anual'?`${y-1}-12`:comp,vencimento:venc,ajustado:venc!==orig?orig:'',valor,calculado,status:'pendente',modeloId:md.id,obs:md.obs||''});
  }
  return out;
}
/* contas fixas (escritório virtual, softwares…): viram saídas a pagar no mês */
const fixas=()=>S.modelos.filter(md=>md.tipo==='despesa').sort((a,b)=>(+a.dia||0)-(+b.dia||0)||String(a.nome).localeCompare(b.nome));
function fixasDoMes(y,m){
  return fixas().filter(md=>md.ativo!==false&&(md.periodicidade!=='anual'||+md.mes===m)).map(md=>{
    const orig=iso(y,m,Math.min(+md.dia||10,daysIn(y,m)));
    return{id:`${md.id}-${ym(y,m)}`,tipo:'saida',data:ajustar(orig,md.ajuste),descricao:md.nome,categoria:md.categoria||'Outras saídas',valor:+md.valorPadrao||0,status:'pendente',origem:'fixa',origemId:md.id,obs:md.obs||''};
  });
}

let modal=null;
function openForm(kind,rec,defaults){
  const spec=F[kind];const r={...(defaults||{}),...(rec||{})};
  const fields=spec.f.map(f=>{
    const id='f-'+f.k;const v=r[f.k]??'';
    let inp;
    if(f.type==='select')inp=`<select id="${id}" name="${f.k}">${f.opts.map(([a,b])=>`<option value="${a}" ${String(v)===a?'selected':''}>${b}</option>`).join('')}</select>`;
    else if(f.type==='check'){const on=v===''?f.def!==false:!!v;return `<div class="f check full"><input type="checkbox" id="${id}" name="${f.k}" ${on?'checked':''}><label for="${id}">${f.l}</label></div>`}
    else if(f.type==='list')inp=`<input id="${id}" name="${f.k}" list="${id}-l" value="${esc(v)}" ${f.req?'required':''} autocomplete="off"><datalist id="${id}-l">${f.list(r).map(o=>`<option value="${esc(o)}">`).join('')}</datalist>`;
    else if(f.type==='logo')inp=`<input id="${id}" name="${f.k}" type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp">${v&&v!=='key'?`<img src="${esc(v)}" alt="Logo atual" style="max-height:48px;width:auto;justify-self:start">`:''}`;
    else if(f.type==='money')inp=`<input id="${id}" name="${f.k}" type="number" step="0.01" min="0" inputmode="decimal" value="${v===''?'':esc(v)}" ${f.req?'required':''}>`;
    else inp=`<input id="${id}" name="${f.k}" type="${f.type}" value="${esc(v)}" ${f.req?'required':''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
    return `<div class="f ${f.full?'full':''}"><label for="${id}">${f.l}</label>${inp}${f.help?`<span class="help">${f.help}</span>`:''}</div>`;
  }).join('');
  closeModal();
  modal=document.createElement('div');modal.className='scrim';
  modal.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h2 id="mt">${rec?'Editar':'Novo'} ${spec.t}</h2><button class="btn ghost sm" data-close aria-label="Fechar">✕</button></header>
  <form novalidate>${fields}<div class="err" id="ferr" hidden></div><div class="mactions"><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar</button></div></form></div>`;
  document.body.appendChild(modal);
  const form=modal.querySelector('form');
  modal.addEventListener('click',e=>{if(e.target===modal||e.target.closest('[data-close]'))closeModal()});
  if(kind==='lanc'){const tp=form.tipo;tp.addEventListener('change',()=>{document.getElementById('f-categoria-l').innerHTML=(tp.value==='saida'?CAT_OUT:CAT_IN).map(o=>`<option value="${esc(o)}">`).join('')})
    // marca sozinho quando é entrada do dia 5, até a pessoa mexer na caixa
    const cb=form.contaBeneficio,linha=cb.closest('.f');let mexeu=!!rec;cb.addEventListener('change',()=>mexeu=true);
    const auto=()=>{linha.hidden=tp.value!=='entrada';if(tp.value!=='entrada')cb.checked=false;else if(!mexeu)cb.checked=dia5(form.data.value)};
    tp.addEventListener('change',auto);form.data.addEventListener('change',auto);linha.hidden=tp.value!=='entrada'}
  setTimeout(()=>form.querySelector('input,select')?.focus(),30);
  form.addEventListener('submit',async e=>{
    e.preventDefault();const err=modal.querySelector('#ferr');
    const out={};
    for(const f of spec.f){const el=form[f.k];
      if(f.type==='check'){out[f.k]=el.checked;continue}
      if(f.type==='logo'){const file=el.files&&el.files[0];if(file){try{out[f.k]=await reduzLogo(file)}catch(x){err.textContent=x.message||'Não deu para ler essa imagem.';err.hidden=false;return}}continue}
      let v=el.value.trim();
      if(f.req&&!v){err.textContent=`Preencha “${f.l}”.`;err.hidden=false;el.focus();return}
      if(f.type==='money'||f.type==='number')v=v===''?0:Number(v);
      out[f.k]=v;}
    const btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='Salvando…';
    try{await save(kind,rec,out);closeModal();toast('Salvo')}
    catch(x){btn.disabled=false;btn.textContent='Salvar';err.textContent=msgErr(x);err.hidden=false}
  });
}

// o logo é guardado pequeno (até 320 px) dentro da configuração da conta
function reduzLogo(file){
  return new Promise((ok,falha)=>{
    if(file.size>5e6)return falha(new Error('A imagem passa de 5 MB. Use uma menor.'));
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const max=320,w=img.naturalWidth||max,h=img.naturalHeight||max,k=Math.min(1,max/Math.max(w,h));
      const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);ok(cv.toDataURL('image/png'))};
    img.onerror=()=>{URL.revokeObjectURL(url);falha(new Error('Não deu para ler essa imagem. Use PNG, JPG ou SVG.'))};
    img.src=url;
  });
}

function toRow(col,obj){const r={};for(const[k,v]of Object.entries(obj)){if(v===undefined)continue;if(col==='beneficios'&&k==='id')continue;r[snake(k)]=v===''?null:v}return r}
function fromRow(row){const o={};for(const[k,v]of Object.entries(row))o[camel(k)]=v;return o}
function guardar(col,row){
  if(col==='clt_salarios'){(S.clt[row.funcionario]||(S.clt[row.funcionario]={}))[row.id]=+row.valor||0;return}
  if(col==='beneficios'){S.benef[String(row.ano)]={meses:row.meses||{}};return}
  if(col==='config'){S.config={aliquota:6,...fromRow(row)};return}
  const k=KEY[col],o=fromRow(row),i=S[k].findIndex(x=>x.id===o.id);
  if(i>=0)S[k][i]=o;else S[k].push(o);
}
async function put(col,id,data){
  if(!S.db)throw{code:'no_db'};
  const row=toRow(col,{...data,id});row.atualizado_em=new Date().toISOString();row.dono=S.uid;
  // cada conta tem os próprios dados: a chave é (dono, id)
  const{data:saved,error}=await sb.from(col).upsert(row,{onConflict:CHAVE[col]||'dono,id'}).select().single();
  if(error)throw error;
  guardar(col,saved);later();
}
async function del(col,id,func){
  if(!S.db)throw{code:'no_db'};
  let q=sb.from(col).delete().eq('dono',S.uid).eq('id',id);
  if(col==='clt_salarios')q=q.eq('funcionario',func);
  const{error}=await q;
  if(error)throw error;
  if(col==='clt_salarios'&&S.clt[func])delete S.clt[func][id];
  const k=KEY[col];if(k)S[k]=S[k].filter(x=>x.id!==id);later();

    const{id:_i,atualizadoEm:_a,...atual}=S.config;
    await put('config','empresa',{...atual,...out});if(kind==='config')await atualizarDas();return}
  const spec=F[kind];const id=rec?.id||newId(spec.col);
  const base={...(rec||{})};delete base.id;
  const data={...base,...out,atualizadoEm:new Date().toISOString()};
  if(kind==='fixa'){data.tipo='despesa';data.calculo='fixo'}

    case'preencherBenef':{const y=S.ref.y,meses={...benefMeses(y)};let n=0;
      for(let i=mesInicial(y);i<=12;i++){const k=pad(i);if(+meses[k])continue;const e=entradasMes(ym(y,i));if(e>0){meses[k]=Math.round(e*100)/100;n++}}
      await put('beneficios',String(y),{ano:y,meses,atualizadoEm:new Date().toISOString()});return toast(`${n} ${n===1?'mês preenchido':'meses preenchidos'} com as entradas`)}
  }
  if(a.startsWith('del')){
    if(!armed[a+id]){armed[a+id]=1;btn.classList.add('armed');btn.textContent='Confirmar';setTimeout(()=>{delete armed[a+id];if(btn.isConnected){btn.classList.remove('armed');btn.textContent='Excluir'}},3500);return}
    delete armed[a+id];
    if(a==='delLanc')await del('lancamentos',id);
    if(a==='delNota'){await del('notas',id);if(S.lanc.some(l=>l.id==='nf-'+id))await del('lancamentos','nf-'+id);await atualizarDas()}
    if(a==='delOb'){await del('obrigacoes',id);if(S.lanc.some(l=>l.id==='ob-'+id))await del('lancamentos','ob-'+id)}
    if(a==='delModelo'||a==='delFixa')await del('modelos',id);
    if(a==='delDesc')await del('descontos',id);
    if(a==='delFunc'){
      // leva junto os salários e os descontos da pessoa
      for(const[e,col]of[['clt_salarios','funcionario'],['descontos','funcionario']]){const{error}=await sb.from(e).delete().eq('dono',S.uid).eq(col,id);if(error)throw error}
      await del('funcionarios',id);delete S.clt[id];S.desc=S.desc.filter(d=>d.funcionario!==id);
      if(S.funcSel===id){S.funcSel=null;lembrarFunc()}render();
    }
    toast('Excluído');
  }
  }catch(x){toast(msgErr(x))}
}
async function exportCSV(){
  const k=refYM();const rows=S.lanc.filter(l=>inMonth(l.data,k)).sort((a,b)=>a.data.localeCompare(b.data));
  const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const csv='﻿Data;Tipo;Descrição;Categoria;Valor;Situação;Observação\n'+rows.map(l=>[fmtD(l.data),l.tipo==='entrada'?'Entrada':'Saída',q(l.descricao),q(l.categoria),(+l.valor).toFixed(2).replace('.',','),l.status==='pendente'?'Em aberto':'Pago',q(l.obs)].join(';')).join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=`key-marketing-lancamentos-${k}.csv`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

let tt;function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);clearTimeout(tt);tt=setTimeout(()=>el.remove(),2600)}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('#tabs button');if(tab){S.view=tab.dataset.v;try{localStorage.setItem('km-view',S.view)}catch(_){}render();return}
  const go=e.target.closest('[data-go]');if(go){S.view=go.dataset.go;render();return}
  const lt=e.target.closest('[data-lt]');if(lt){S.lancTipo=lt.dataset.lt;render();return}
  const dia=e.target.closest('[data-dia]');if(dia){const s=dia.dataset.dia;if(s&&!inMonth(s)){const[y,m]=s.split('-').map(Number);S.ref={y,m}}S.dia=s&&S.dia!==s?s:null;render();return}
  const b=e.target.closest('[data-act]');if(b&&!b.disabled)act(b.dataset.act,b.dataset.id,b);
});
document.addEventListener('change',async e=>{
  const ce=e.target.closest('[data-clt]');
  if(ce){const id=ce.dataset.clt,fid=ce.dataset.f,v=Math.round(Number(ce.value)*100)/100;
    try{if(v>0)await put('clt_salarios',id,{valor:v,funcionario:fid});else if(S.clt[fid]&&S.clt[fid][id]!==undefined)await del('clt_salarios',id,fid)}catch(x){toast(msgErr(x))}
    return}
  const el=e.target.closest('[data-bm]');if(!el)return;
  const y=S.ref.y,meses={...benefMeses(y)},v=Number(el.value);
  if(v>0)meses[el.dataset.bm]=Math.round(v*100)/100;else delete meses[el.dataset.bm];
  S.benef[String(y)]={...(S.benef[String(y)]||{}),meses};
  try{await put('beneficios',String(y),{ano:y,meses,atualizadoEm:new Date().toISOString()})}catch(x){toast(msgErr(x))}
});
const shift=n=>{S.ref=addM(S.ref.y,S.ref.m,n);S.dia=null;render()};
document.getElementById('mPrev').onclick=()=>shift(-1);
document.getElementById('mNext').onclick=()=>shift(1);
document.getElementById('mHoje').onclick=()=>{const d=new Date();S.ref={y:d.getFullYear(),m:d.getMonth()+1};S.dia=null;render()};

/* ---------- dados ---------- */
let renderQ=0;const later=()=>{cancelAnimationFrame(renderQ);renderQ=requestAnimationFrame(render)};
async function carregar(){
  const tabelas=['lancamentos','notas','obrigacoes','modelos','beneficios','config','clt_salarios','descontos','funcionarios'];
  const res=await Promise.all(tabelas.map(t=>sb.from(t).select('*'))).catch(e=>[{error:e}]);
  const falha=res.find(r=>r.error);
  if(falha){console.error(falha.error);S.offline=true;render();return}
  const[l,n,o,m,b,c,cl,ds,fu]=res.map(r=>r.data);
  S.desc=ds.map(fromRow);S.func=fu.map(fromRow);
  S.clt={};cl.forEach(r=>{(S.clt[r.funcionario]||(S.clt[r.funcionario]={}))[r.id]=+r.valor||0});
  if(!S.funcSel){try{S.funcSel=localStorage.getItem('km-func')||null}catch(e){}}
  S.lanc=l.map(fromRow);S.notas=n.map(fromRow);S.obrig=o.map(fromRow);S.modelos=m.map(fromRow);
  S.benef=Object.fromEntries(b.map(r=>[String(r.ano),{meses:r.meses||{}}]));
  const cf=c.find(r=>r.id==='empresa');if(cf)S.config={aliquota:6,...fromRow(cf)};
  S.offline=false;S.carregou=true;render();
  automaticos().catch(x=>console.error('automáticos',x));
}
/* impostos do mês atual e do próximo aparecem sozinhos; o DAS acompanha as notas até ser pago */
async function automaticos(){
  if(!S.canWrite||S.semAcesso)return;
  const d=new Date();
  for(const n of[0,1]){const p=addM(d.getFullYear(),d.getMonth()+1,n);
    for(const x of modelosDoMes(p.y,p.m)){if(S.obrig.some(o=>o.id===x.id))continue;const dd={...x};delete dd.id;await put('obrigacoes',x.id,dd)}}
  await atualizarDas();
}
async function atualizarDas(){
  if(!S.canWrite)return;
  for(const o of S.obrig){
    if(o.status==='pago'||o.modeloId!=='das'||!o.competencia)continue;
    if(!o.calculado&&+o.valor)continue; // valor digitado à mão (ex.: do PGDAS) fica como está
    const v=r2(faturado(o.competencia)*(+S.config.aliquota||0)/100);
    if(v!==+o.valor||!o.calculado){const dd={...o,valor:v,calculado:true};delete dd.id;await put('obrigacoes',o.id,dd)}
  }
}
async function entrou(session){
  document.getElementById('login').hidden=true;
  document.getElementById('btnSair').hidden=false;
  S.db=sb;S.email=session.user.email;S.uid=session.user.id;
  const{data:ok,error}=await sb.rpc('eh_membro');
  if(error){console.error(error);S.offline=true;render();return}
  S.semAcesso=!ok;S.canWrite=!!ok;
  if(ok)await carregar();else render();
}
function pedirLogin(){
  S.db=null;S.uid=null;S.email=null;S.lanc=[];S.notas=[];S.obrig=[];S.modelos=[];S.benef={};S.clt={};S.desc=[];S.func=[];S.funcSel=null;S.config={aliquota:6};S.semAcesso=false;S.carregou=false;
  document.getElementById('btnSair').hidden=true;
  document.getElementById('login').hidden=false;
  render();setTimeout(()=>document.getElementById('lgEmail').focus(),30);
}

/* tela de login */
let criando=false;
const lgMsg=(t,tipo)=>{const el=document.getElementById('lgMsg');el.textContent=t;el.className='msg '+(tipo||'erro');el.hidden=!t};
document.getElementById('lgTroca').onclick=()=>{
  criando=!criando;lgMsg('');
  document.getElementById('loginTitulo').textContent=criando?'Criar minha conta no AIME Financy':'Entrar no AIME Financy';
  document.getElementById('loginSub').textContent=criando?'Cada conta tem o seu próprio financeiro: ninguém vê os dados de outra pessoa. Senha com pelo menos 8 caracteres.':'Use o e-mail e a senha da sua conta.';
  document.getElementById('lgBtn').textContent=criando?'Criar conta':'Entrar';
  document.getElementById('lgTroca').textContent=criando?'Já tenho conta. Entrar':'Primeiro acesso? Criar minha conta';
  document.getElementById('lgSenha').autocomplete=criando?'new-password':'current-password';
};
document.getElementById('loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.getElementById('lgEmail').value.trim(),senha=document.getElementById('lgSenha').value;
  if(!email||!senha)return lgMsg('Preencha e-mail e senha.');
  if(criando&&senha.length<8)return lgMsg('A senha precisa ter pelo menos 8 caracteres.');
  const btn=document.getElementById('lgBtn');btn.disabled=true;lgMsg('');
  try{
    if(criando){
      const{data,error}=await sb.auth.signUp({email,password:senha,options:{emailRedirectTo:location.origin+location.pathname}});
      if(error)throw error;
      if(!data.session){lgMsg('Conta criada. Enviamos um link para '+email+'. Clique nele para confirmar e depois entre aqui.','ok');document.getElementById('lgTroca').click();lgMsg('Conta criada. Confirme pelo link enviado para '+email+' e depois entre aqui.','ok')}
    }else{
      const{error}=await sb.auth.signInWithPassword({email,password:senha});
      if(error)throw error;
    }
  }catch(x){
    const m=x?.message||'';
    lgMsg(/invalid login/i.test(m)?'E-mail ou senha incorretos.':/not confirmed/i.test(m)?'Confirme seu e-mail pelo link que enviamos antes de entrar.':/already registered/i.test(m)?'Este e-mail já tem conta. Use “Já tenho conta. Entrar”.':/rate limit/i.test(m)?'Muitas tentativas seguidas. Espere alguns minutos.':'Não deu certo: '+m);
  }finally{btn.disabled=false}
});
document.getElementById('btnSair').onclick=()=>sb.auth.signOut();

async function boot(){
  render();
  if(!sb){S.loaded=-1;render();return}
  let atual;
  sb.auth.onAuthStateChange((ev,session)=>{
    const id=session?.user?.id||null;
    if(id===atual)return;atual=id;
    setTimeout(()=>{session?entrou(session):pedirLogin()},0);
  });
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.db&&!S.semAcesso&&!modal)carregar()});
}
boot();
})();
